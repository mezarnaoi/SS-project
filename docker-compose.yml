services:
  # Go API Service
  go-api:
    build: ./server
    user: "${UID}:${GID}"
    container_name: go-api
    image: stefandarius/mqtt-ss-api:latest
    env_file: .env
    environment:
      - MQTT_HOST_IP=${HOST_IP:-host.docker.internal}
      - MQTT_MAX_PAYLOAD_BYTES=5242880
      - OCR_SERVICE_URL=http://ocr-sandbox:9000
      - MQTT_RATE_LIMIT_MESSAGES=5
      - MQTT_RATE_LIMIT_WINDOW_SECONDS=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo-db
      - broker
      - ocr-sandbox
    ports:
      - 8080:8080
    volumes:
      - ./uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    networks:
      - backend

  ocr-sandbox:
      build: ./ocr-sandbox
      container_name: ocr-sandbox
      image: ss-project-ocr-sandbox:local
      read_only: true
      tmpfs:
        - /tmp:size=64m,noexec,nosuid,nodev
      security_opt:
        - no-new-privileges:true
      cap_drop:
        - ALL
      pids_limit: 128
      mem_limit: 512m
      cpus: "1.0"
      networks:
        - backend
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
        interval: 30s
        timeout: 5s
        retries: 3


  broker:
    user: "${UID}:${GID}"
    image: eclipse-mosquitto:latest
    container_name: broker
    hostname: broker
    ports:
      - "8883:8883"
    # - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./secrets:/run/secrets:ro
    networks:
      - backend

  mongo-db:
    container_name: mongo-db
    image: mongo:latest
    env_file: .env
    command: ["--auth"]
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - backend

volumes:
  mongo-data:

networks:
  backend:

