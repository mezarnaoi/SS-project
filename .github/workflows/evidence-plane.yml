name: Evidence Plane - SBOM and Audit Artifacts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write
  attestations: write


jobs:
  evidence-plane:
    name: Generate SBOM and audit evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence directories
        run: |
          mkdir -p evidence/sbom
          mkdir -p evidence/tests
          mkdir -p evidence/security
          mkdir -p evidence/logs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: server/go.sum

      - name: Run Go tests and save logs
        working-directory: server
        run: |
          set -o pipefail
          go test ./... -v 2>&1 | tee ../evidence/tests/go-test.log

      - name: Save Go dependency list
        working-directory: server
        run: |
          go list -m all > ../evidence/security/go-dependencies.txt

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go vulnerability check
        working-directory: server
        continue-on-error: true
        run: |
          govulncheck ./... 2>&1 | tee ../evidence/security/govulncheck-report.txt

      - name: Set up Node.js
        if: hashFiles('client/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Run frontend dependency audit
        if: hashFiles('client/package.json') != ''
        working-directory: client
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate --json > ../evidence/security/frontend-npm-audit.json || true

      - name: Generate repository SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: evidence/sbom/sbom.spdx.json

      - name: Generate CycloneDX SBOM for Go backend
        working-directory: server
        continue-on-error: true
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output ../evidence/sbom/backend-cyclonedx.json

      - name: Write evidence manifest
        run: |
          cat > evidence/evidence-manifest.md <<EOF
          # Evidence Manifest

          This artifact bundle was generated automatically by GitHub Actions.

          ## Workflow context

          - Repository: ${{ github.repository }}
          - Commit SHA: ${{ github.sha }}
          - Ref: ${{ github.ref }}
          - Actor: ${{ github.actor }}
          - Event: ${{ github.event_name }}
          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}

          ## Included evidence

          - \`sbom/sbom.spdx.json\` - repository SBOM in SPDX JSON format
          - \`sbom/backend-cyclonedx.json\` - Go backend SBOM in CycloneDX format, if generated successfully
          - \`tests/go-test.log\` - backend test execution log
          - \`security/go-dependencies.txt\` - Go dependency inventory
          - \`security/govulncheck-report.txt\` - Go vulnerability check output
          - \`security/frontend-npm-audit.json\` - frontend dependency audit output, if frontend exists

          ## Purpose

          These files support auditability, dependency traceability, security review, provenance and CI/CD evidence collection.

          ## Provenance

          Selected evidence files are attested using GitHub Artifact Attestations. The attestations bind the generated evidence to this repository, commit and workflow run.
          EOF

      - name: Generate provenance attestation for evidence manifest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: evidence/evidence-manifest.md

      - name: Generate provenance attestation for repository SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: evidence/sbom/sbom.spdx.json

      - name: Generate provenance attestation for backend CycloneDX SBOM
        if: github.event_name != 'pull_request' && hashFiles('evidence/sbom/backend-cyclonedx.json') != ''
        uses: actions/attest@v4
        with:
          subject-path: evidence/sbom/backend-cyclonedx.json

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-plane-artifacts-${{ github.sha }}
          path: evidence/
          retention-days: 90