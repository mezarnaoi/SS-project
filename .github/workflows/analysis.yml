name: Static Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server
          args: --timeout=5m --out-format=sarif --output.sarif.path=golangci-results.sarif
        continue-on-error: true

      - name: Upload golangci-lint SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: server/golangci-results.sarif
          category: golangci-lint
        if: always()

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, javascript-typescript
          queries: security-and-quality

      - name: Install system dependencies
        run: sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql
