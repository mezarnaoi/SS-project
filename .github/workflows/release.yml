name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ss-project:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ss-project:latest

      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp docker-compose.yml release-assets/
          cp server/sbom.cdx.json release-assets/
          cat > release-assets/.env.example << 'EOF'
          UID=1000
          GID=1000
          MONGO_INITDB_ROOT_USERNAME=admin
          MONGO_INITDB_ROOT_PASSWORD=changeme
          JWT_SECRET=change-this-secret
          MQTT_HOST_IP=127.0.0.1
          EOF
          zip -j release-assets/ss-project-${{ steps.version.outputs.VERSION }}.zip \
            release-assets/docker-compose.yml \
            release-assets/.env.example \
            release-assets/sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## SS-Project ${{ steps.version.outputs.VERSION }}

            ### Run with Docker
```bash
            docker pull ghcr.io/${{ github.repository_owner }}/ss-project:${{ steps.version.outputs.VERSION }}
```
            Download the zip, configure `.env.example` → `.env`, then:
```bash
            docker compose up -d
```

            ### Artifacts
            - Docker image: `ghcr.io/${{ github.repository_owner }}/ss-project:${{ steps.version.outputs.VERSION }}`
            - SBOM: `sbom.cdx.json`
          files: |
            release-assets/ss-project-${{ steps.version.outputs.VERSION }}.zip
            release-assets/sbom.cdx.json
