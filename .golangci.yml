version: "2"
linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocritic
    - gocyclo
    - misspell
    - bodyclose
    - noctx

linters-settings:
  gocyclo:
    min-complexity: 15
  gocritic:
    enabled-tags:
      - diagnostic
      - security

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
